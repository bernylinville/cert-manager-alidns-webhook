apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cert-manager-alidns-webhook.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "cert-manager-alidns-webhook.name" . }}
    chart: {{ include "cert-manager-alidns-webhook.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "cert-manager-alidns-webhook.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "cert-manager-alidns-webhook.name" . }}
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "cert-manager-alidns-webhook.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port={{ .Values.securePort }}
          env:
            # GROUP_NAME - cert-manager webhook API group
            - name: GROUP_NAME
              value: {{ .Values.groupName | quote }}
            - name: ALIDNS_ALLOWED_ZONES
              value: {{ join "," .Values.allowedZones | quote }}
            - name: HOME
              value: /home/nonroot
            {{- /* 环境变量 REGION_ID */}}

            {{- if .Values.aliyunAuth.regionID }}
            - name: ALIBABA_CLOUD_REGION_ID
              value: {{ .Values.aliyunAuth.regionID | quote }}
            {{- end }}

            {{- /* 方式1: 环境变量 AK/SK */}}
            {{- if .Values.aliyunAuth.accessKeyID }}
            - name: ALIBABA_CLOUD_ACCESS_KEY_ID
              value: {{ .Values.aliyunAuth.accessKeyID | quote }}
            {{- end }}
            {{- if .Values.aliyunAuth.accessKeySecret }}
            - name: ALIBABA_CLOUD_ACCESS_KEY_SECRET
              value: {{ .Values.aliyunAuth.accessKeySecret | quote }}
            {{- end }}

            {{- /* 方式2: 从 Secret 引用 AK/SK */}}
            {{- if .Values.aliyunAuth.existingSecret }}
            - name: ALIBABA_CLOUD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aliyunAuth.existingSecret | quote }}
                  key: accessKeyID
            - name: ALIBABA_CLOUD_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aliyunAuth.existingSecret | quote }}
                  key: accessKeySecret
            {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.securePort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
            {{- /* config.json volume mount */}}
            {{- if .Values.aliyunAuth.configJSON.enabled }}
            - name: aliyun-config
              mountPath: /home/nonroot/.aliyun
              readOnly: true
            {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: certs
          secret:
            secretName: {{ include "cert-manager-alidns-webhook.servingCertificate" . }}
        {{- /* config.json volume */}}
        {{- if .Values.aliyunAuth.configJSON.enabled }}
        - name: aliyun-config
          configMap:
            name: {{ .Values.aliyunAuth.configJSON.configMapName | quote }}
        {{- end }}
    {{- if .Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.topologySpreadConstraints.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: {{ include "cert-manager-alidns-webhook.name" . }}
              release: {{ .Release.Name }}
    {{- end }}
    {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- if or .Values.podAntiAffinity.enabled .Values.affinity }}
      affinity:
      {{- if .Values.podAntiAffinity.enabled }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.podAntiAffinity.weight }}
              podAffinityTerm:
                topologyKey: {{ .Values.podAntiAffinity.topologyKey | quote }}
                labelSelector:
                  matchLabels:
                    app: {{ include "cert-manager-alidns-webhook.name" . }}
                    release: {{ .Release.Name }}
      {{- end }}
      {{- with .Values.affinity }}
{{ toYaml . | indent 8 }}
      {{- end }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
