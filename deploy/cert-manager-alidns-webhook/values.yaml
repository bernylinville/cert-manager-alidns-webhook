# -- Aggregated API group exposed by this webhook. Issuer references must match.
groupName: alidns.bernylinville.github.io

# -- DNS zones the webhook may mutate. Empty by default: the webhook fails closed until explicitly configured.
allowedZones: []

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  repository: ghcr.io/bernylinville/cert-manager-alidns-webhook
  tag: ""
  pullPolicy: IfNotPresent
  # -- Optional sha256 manifest digest. When set, deployment renders tag@digest.
  digest: ""

# -- Image pull secrets attached to the webhook Pod.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# -- Replica count for the webhook deployment.
replicaCount: 2

# -- Unprivileged HTTPS port listened on by the non-root webhook container.
securePort: 10250

service:
  type: ClusterIP
  port: 443

# -- Alibaba Cloud authentication via the credentials-go default chain.
aliyunAuth:
  regionID: ""
  accessKeyID: ""
  accessKeySecret: ""
  existingSecret: ""
  rrsa:
    enabled: false
    roleName: ""
  configJSON:
    enabled: false
    configMapName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 32Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: null

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# -- Generated anti-affinity. Disable before defining podAntiAffinity in affinity.
podAntiAffinity:
  enabled: true
  topologyKey: kubernetes.io/hostname
  weight: 100

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: https
          protocol: TCP
  egress: []
